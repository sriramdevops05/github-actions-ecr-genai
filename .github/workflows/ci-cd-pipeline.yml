name: CI/CD Pipeline with GenAI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: BUILD AND TEST
  # ─────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      test-result: ${{ steps.test.outcome }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Unit Tests
        id: test
        run: |
          pytest app/test_app.py -v --tb=short 2>&1 | tee test-results.txt
          echo "Tests completed"

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          echo "Docker build successful"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt

  # ─────────────────────────────────────────
  # JOB 2: GENAI ANALYSIS
  # ─────────────────────────────────────────
  genai-analysis:
    name: GenAI Pipeline Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Call OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          COMMITS=$(git log --oneline -3 --pretty=format:"%h %s")
          TEST_OUTPUT=$(cat test-results.txt 2>/dev/null || echo "No test output")

          curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-3.5-turbo\",
              \"messages\": [{
                \"role\": \"user\",
                \"content\": \"Analyze this CI/CD build and generate summary, release notes and risk flags.\n\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\n\nRecent commits:\n$COMMITS\n\nTest Results:\n$TEST_OUTPUT\"
              }],
              \"max_tokens\": 500
            }" > raw_response.json

          cat raw_response.json

      - name: Parse AI Response
        run: |
          python3 << 'EOF'
          import json

          with open('raw_response.json', 'r') as f:
              data = json.load(f)

          print('Full API Response:', json.dumps(data, indent=2))

          if 'choices' in data:
              content = data['choices'][0]['message']['content']
              print(content)
              with open('ai-summary.md', 'w') as f:
                  f.write(content)
          elif 'error' in data:
              print('OpenAI Error:', data['error']['message'])
              with open('ai-summary.md', 'w') as f:
                  f.write('AI analysis unavailable: ' + data['error']['message'])
          EOF

      - name: Upload AI Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-build-summary
          path: ai-summary.md

  # ─────────────────────────────────────────
  # JOB 3: PUSH TO AWS ECR
  # ─────────────────────────────────────────
  push-to-ecr:
    name: Push to AWS ECR
    runs-on: ubuntu-latest
    needs: [build-and-test, genai-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Tag and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Download AI Summary
        uses: actions/download-artifact@v4
        with:
          name: ai-build-summary

      - name: Post Deployment Summary
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`$IMAGE_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR Repo | \`$ECR_REPOSITORY\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## AI Analysis" >> $GITHUB_STEP_SUMMARY
          cat ai-summary.md >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 4: NOTIFICATION
  # ─────────────────────────────────────────
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [push-to-ecr]
    if: always()

    steps:
      - name: Notify Success
        if: needs.push-to-ecr.result == 'success'
        run: |
          echo "Pipeline SUCCESS - Image deployed to ECR"
          echo "Commit: ${{ github.sha }}"

      - name: Notify Failure
        if: needs.push-to-ecr.result == 'failure'
        run: |
          echo "Pipeline FAILED - Check logs above"
